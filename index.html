const stageName = st => st === "validation" ? "validation" : "relecture";
function reviewSection(a){
  const log = a.reviewLog || [], rv = activeRev(a);
  const dl = d => { const i = dueInfo(d,false); return esc(i.title) + (i.n < 0 ? ` · ${-i.n} j de retard` : ""); };
  let state = "";
  if(rv && rv.state === "pending"){
    state = `<div class="rv pending"><div class="rv-state">${avatar(rv.reviewer,"sm")}<div><b>En attente de la ${stageName(rv.stage)} de ${esc(person(rv.reviewer).name)}</b><small>Deadline : ${rv.due?dl(rv.due):"non définie"} · demandée par ${esc(person(rv.requester).name)}</small></div></div>
      ${S.readOnly?"":`<div class="rv-btns"><button class="btn primary sm" data-act="rv-return">${I.ret}${rv.stage==="validation"?"Validation faite":"Relecture faite"}</button></div>`}</div>`;
  } else if(a.status === "waiting"){
    state = `<div class="rv pending"><div class="rv-state"><span class="av sm none">?</span><div><b>Personne n’est désigné pour le retour</b><small>Indiquez qui relit ou valide, avec une deadline.</small></div></div>${S.readOnly?"":`<div class="rv-btns"><button class="btn primary sm" data-act="rv-request">${I.send}Demander un retour</button></div>`}</div>`;
  } else if(rv && rv.state === "returned"){
    state = `<div class="rv returned"><div class="rv-state">${avatar(rv.requester,"sm")}<div><b>À modifier par ${esc(person(rv.requester).name)}</b><small>Suite à la ${stageName(rv.stage)} de ${esc(person(rv.reviewer).name)} · deadline : ${rv.due?dl(rv.due):"non définie"}</small></div></div>${S.readOnly?"":`<div class="rv-btns"><button class="btn primary sm" data-act="rv-request">${I.send}Renvoyer en ${stageName(rv.stage)}</button></div>`}</div>`;
  }
  if(!state && !log.length) return "";
  const lab = l => l.type === "request" ? `Envoyée en ${stageName(l.stage)} à ${esc(person(l.to).name)}`
    : l.type === "return" ? `Renvoyée pour modification à ${esc(person(l.to).name)}`
    : (l.stage === "validation" ? "Validée, action terminée" : `Relecture validée, rendue à ${esc(person(l.to).name)}`);
  const logH = log.length ? `<ul class="rlog">${log.slice().reverse().map(l=>`<li class="${l.type==="return"?"r-return":l.type==="ok"?"r-ok":""}"><b>${lab(l)}</b><small>par ${esc(person(l.by).name)}, ${esc(fmtStamp.format(new Date(l.at)))}${l.due?` · deadline ${esc(fmtShort.format(parseISO(l.due)))}`:""}</small>${l.note?`<q>${esc(l.note)}</q>`:""}</li>`).join("")}</ul>` : "";
  return `<section><h3>Suivi relecture et validation</h3><div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">${state}${logH}</div></section>`;
}

/* ======================= Modale relecture ======================= */
function getAct(id){ return S.actions.get(id) || (S.draft && S.draft.id === id ? S.draft : null); }
function plusDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return isoOf(d); }
function defaultStage(a){
  const relOk = (a.reviewLog||[]).some(l=>l.type==="ok" && l.stage !== "validation");
  return a.valideur && (relOk || !a.relecteur) ? "validation" : "relecture";
}
function openReviewModal(id, mode, extra){
  if(ro()) return;
  const a = getAct(id); if(!a) return;
  extra = extra || {};
  const r = a.review || {}, isReq = mode === "request";
  const stage = isReq ? (extra.stage || defaultStage(a)) : (r.stage || "relecture");
  S.modal = {id, mode, stage, extra};
  const stageWho = st => st === "validation" ? a.valideur : a.relecteur;
  const others = settings().people.filter(p=>p.id !== a.owner);
  const defWho = isReq ? (stageWho(stage) || (others[0]||{}).id || "") : (r.requester || a.owner);
  const Stg = stage === "validation" ? "Validation" : "Relecture";
  $("#modal").innerHTML = `<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mh"><span class="ti-ic ${isReq?"ic-amber":"ic-violet"}">${isReq?I.review:I.ret}</span><div><h2 id="mTitle">${isReq?"Envoyer en "+stage:Stg+" faite"}</h2><p>${esc(a.title||"Nouvelle action")}</p></div><button class="x" data-act="m-close" aria-label="Fermer">${I.x}</button></div>
    ${isReq ? `<div class="fld"><span>Étape</span><div class="seg" role="group" aria-label="Étape">${["relecture","validation"].map(x=>`<button data-act="m-stage" data-v="${x}" class="${x===stage?"on":""}" aria-pressed="${x===stage}">${x==="relecture"?"Relecture":"Validation"}${stageWho(x)?" · "+esc(person(stageWho(x)).name):""}</button>`).join("")}</div></div>` : ""}
    <div class="grid2">
      ${(()=>{ const lw = isReq ? stageWho(stage) : (r.requester || a.owner); const lb = isReq ? (stage==="validation"?"Qui valide":"Qui relit") : "Renvoyée à"; return lw ? `<div class="fld"><span>${lb}</span><div class="lockv">${avatar(lw,"sm")}${esc(person(lw).name)}</div><input type="hidden" id="mWho" value="${esc(lw)}"></div>` : `<label class="fld"><span>${lb}</span><select id="mWho">${peopleOpts(defWho)}</select></label>`; })()}
      <label class="fld"><span>${isReq?"Deadline du retour":"Deadline des modifications"}</span><input type="date" id="mDue" value="${plusDays(3)}"></label>
    </div>
    <label class="fld"><span>${isReq?"Message (optionnel)":"Commentaires"}</span><textarea id="mNote" rows="3" placeholder="${isReq?"Ce qu’il faut regarder, liens, points d’attention":"Ce qu’il faut modifier"}"></textarea></label>
    <p class="m-err" id="mErr" hidden></p>
    <div class="m-btns"><button class="btn" data-act="m-close">Annuler</button>${isReq?"":`<button class="btn" data-act="m-ok">${I.check}${stage==="validation"?"Valider : action terminée":"Relecture OK, sans modification"}</button>`}<button class="btn primary" data-act="m-send">${isReq?I.send+"Envoyer en "+stage:I.ret+"Renvoyer pour modification"}</button></div>
  </div></div>`;
  setTimeout(()=>{ const n = $("#mNote"); n && n.focus(); }, 30);
}
function closeModal(){ S.modal = null; $("#modal").innerHTML = ""; }
function submitModal(kind){
  const m = S.modal; if(!m) return;
  const cur = getAct(m.id); if(!cur){ closeModal(); return; }
  const who = $("#mWho").value, due = $("#mDue").value, note = $("#mNote").value.trim();
  if(kind !== "ok" && (!who || !due)){ const e = $("#mErr"); e.textContent = "Choisissez une personne et une deadline."; e.hidden = false; return; }
  const a = clone(cur);
  if(S.openId === a.id){ const t = $(".dw-title"), d = $('[data-field="desc"]'); if(t && t.value.trim()) a.title = t.value.trim(); if(d) a.desc = d.value; }
  if(!a.title) a.title = "Sans titre";
  a.reviewLog = a.reviewLog || [];
  const now = Date.now(), stage = m.stage; let msg;
  if(m.mode === "request"){
    if(stage === "validation"){ if(!a.valideur) a.valideur = who; } else if(!a.relecteur) a.relecteur = who;
    a.review = {state:"pending", stage, reviewer:who, requester:a.owner || S.me, due, at:now};
    a.status = "waiting"; a.doneAt = null;
    a.reviewLog.push({type:"request", stage, by:S.me, to:who, due, note, at:now});
    msg = `Envoyée en ${stage} à ${person(who).name}, retour attendu ${dueInfo(due,false).txt.toLowerCase()}.`;
  } else if(kind === "ok"){
    const back = (a.review && a.review.requester) || a.owner;
    a.review = Object.assign({}, a.review || {}, {state:"closed"});
    a.owner = back;
    if(stage === "validation"){ a.status = "done"; a.doneAt = now; msg = "Validée : l’action est terminée."; }
    else { a.status = "doing"; a.doneAt = null; msg = `Relecture OK : l’action revient en cours chez ${person(back).name}` + (a.valideur ? `, prochaine étape validation par ${person(a.valideur).name}.` : "."); }
    a.reviewLog.push({type:"ok", stage, by:S.me, to:back, note, at:now});
  } else {
    const rvw = (a.review && a.review.reviewer) || S.me;
    a.review = {state:"returned", stage, reviewer:rvw, requester:who, due, at:now};
    a.status = "week"; a.owner = who; a.doneAt = null;
    a.reviewLog.push({type:"return", stage, by:S.me, to:who, due, note, at:now});
    msg = `Renvoyée à ${person(who).name} pour modification.`;
  }
  closeModal();
  if(persist(a)){ toast(msg); if(S.openId === a.id) renderDrawer(); }
}

function refreshDrawerBits(a){
  const subs = a.subtasks||[], nd = subs.filter(t=>t.done).length;
  const p = $("#subProg"); if(p) p.textContent = subs.length ? `${nd} sur ${subs.length} faites` : "";
  const b = $("#subBar"); if(b) b.style.width = (subs.length ? Math.round(nd/subs.length*100) : 0) + "%";
  const h = $("#hint"); if(h){ const t = hintText(a); h.innerHTML = t ? I.info + esc(t) : ""; }
}
function setField(f, v){
  const cur = current(); if(!cur) return;
  if(f === "status" && v === "waiting" && cur.status !== "waiting"){ const sel = $('[data-field="status"]'); if(sel) sel.value = cur.status; openReviewModal(cur.id, "request"); return; }
  const a = clone(cur); if((a[f] ?? "") === v) return;
  if(f === "title" && !v && S.draft && S.draft.id === a.id) return;
  a[f] = f === "title" ? (v || "Sans titre") : v;
  if(f === "status"){ a.status = cur.status; applyStatus(a, v); if(v === "later"){ const d = effDue(a); if(d && daysUntil(d) <= 7) toast("Échéance sous 7 jours : l’action reste dans « À faire cette semaine »."); } }
  if(!a.title) a.title = "Sans titre";
  const isDraft = !!(S.draft && S.draft.id === a.id);
  saveCur(a); refreshDrawerBits(a);
  if(f === "status" && !isDraft) renderDrawer();
  if(f === "space"){ const sm = $(".dw-h small"); if(sm) sm.textContent = backlogOf(v).name; }
}
function editSub(sid, fn){
  const cur = current(); if(!cur) return;
  const a = clone(cur), t = (a.subtasks||[]).find(x=>x.id===sid); if(!t) return;
  fn(t); if(saveCur(a)) refreshDrawerBits(a);
}
function addSub(){
  const inp = $("#stNew"), txt = inp.value.trim(); if(!txt){ inp.focus(); return; }
  const a = clone(current()); if(!a.title) a.title = "Sans titre";
  a.subtasks = a.subtasks || [];
  const who = $("#stWho").value;
  a.subtasks.push({id:uid("t"), text:txt, assignee:who, due:$("#stDue").value, done:false, doneAt:null});
  if(saveCur(a)){ renderDrawer(); $("#stWho").value = who; $("#stNew").focus(); }
}
function addComment(){
  const ta = $("#cNew"), txt = ta.value.trim(); if(!txt) return;
  const a = clone(current()); if(!a.title) a.title = "Sans titre";
  a.comments = a.comments || []; a.comments.push({id:uid("c"), who:S.me, text:txt, at:Date.now()});
  if(persist(a)){ renderDrawer(); const c = $("#cNew"); c && c.focus(); }
}

/* ======================= Actions plateau ======================= */
function toggleSub(aid, sid, done){
  const cur = S.actions.get(aid); if(!cur) return;
  const a = clone(cur), t = (a.subtasks||[]).find(x=>x.id===sid); if(!t) return;
  t.done = done; t.doneAt = done ? Date.now() : null;
  if(persist(a) && done) toast(a.subtasks.every(x=>x.done) ? "Toutes les tâches de cette action sont faites." : "Tâche cochée.");
}
function moveTo(id, status, space){
  const cur = S.actions.get(id); if(!cur) return;
  if(status === "waiting" && cur.status !== "waiting"){ openReviewModal(id, "request", {space}); return; }
  const a = clone(cur); let ch = false;
  if(space && backlogOf(a.space).id !== space){ a.space = space; ch = true; }
  if(status && status !== a.status && !(status === "week" && effStatus(a).s === "week" && a.status === "week")){
    if(status === "later"){ const d = effDue(a); if(d && daysUntil(d) <= 7) toast("Échéance sous 7 jours : l’action reste dans « À faire cette semaine »."); }
    applyStatus(a, status); ch = true;
  }
  if(ch) persist(a);
}

/* ======================= Événements ======================= */
document.addEventListener("click", e=>{
  const t = e.target;
  if(t.closest("#modal")){
    if(t.classList.contains("ov")){ closeModal(); return; }
    const mb = t.closest("[data-act]"); if(!mb) return;
    if(mb.dataset.act === "m-close") closeModal();
    else if(mb.dataset.act === "m-send") submitModal("send");
    else if(mb.dataset.act === "m-ok") submitModal("ok");
    else if(mb.dataset.act === "d-del") doDelete(false);
    else if(mb.dataset.act === "d-force") doDelete(true);
    else if(mb.dataset.act === "m-stage"){ const n = $("#mNote").value; openReviewModal(S.modal.id, "request", Object.assign({}, S.modal.extra, {stage: mb.dataset.v})); $("#mNote").value = n; }
    return;
  }
  // Panneau
  if(t.closest("#drawer")){
    const pb = t.closest("[data-prio]");
    if(pb){ setField("priority", pb.dataset.prio); document.querySelectorAll(".seg button").forEach(b=>{ const on = b===pb; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); }); return; }
    const del = t.closest(".st-del");
    if(del){ const sid = del.closest("li").dataset.sub; const a = clone(current()); if(S.actions.has(a.id)) return; a.subtasks = a.subtasks.filter(x=>x.id!==sid); if(saveCur(a)) renderDrawer(); return; }
    const b = t.closest("[data-act]"); if(!b) return;
    const act = b.dataset.act;
    if(act === "dw-close") closeDrawer();
    else if(act === "add-sub") addSub();
    else if(act === "add-com") addComment();
    else if(act === "pg-save") submitProgress();
    else if(act === "fe-open") openFicheEdit();
    else if(act === "fe-cancel"){ S.fe = null; renderDrawer(); }
    else if(act === "fe-save") saveFicheEdit();
    else if(act === "ce-open"){ S.ce = b.dataset.v; renderDrawer(); setTimeout(()=>{ const t = $("#ceText"); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 30); }
    else if(act === "ce-cancel"){ S.ce = null; renderDrawer(); }
    else if(act === "ce-save") saveCommentEdit(b.dataset.v);
    else if(act === "del-open"){ const a = current(); if(a) openDeleteModal(a.id); }
    else if(act === "pg-st"){ pgSync(); S.pg.stOpen = true; renderDrawer(); }
    else if(act === "set-status"){ const a = current(); if(!a) return; const v = b.dataset.v; if(v === a.status) return;
      if(v === "waiting"){ openReviewModal(a.id, "request"); return; }
      const n = clone(a); applyStatus(n, v); if(persist(n)){ renderDrawer(); toast("Statut : "+COL_NAME[v]+"."); } }
    else if(act === "rv-request"){ const a = current(); if(a) openReviewModal(a.id, "request"); }
    else if(act === "rv-return"){ const a = current(); if(a) openReviewModal(a.id, "return"); }
    else if(act === "dw-delete"){ const a = current(); if(!a) return; if(S.pendingConfirm === "del:"+a.id){ const id = a.id; S.openId = null; closeDrawer(); removeAction(id); toast("Action supprimée."); } else { S.pendingConfirm = "del:"+a.id; renderDrawer(); } }
    return;
  }
  if(S.profOpen && !t.closest(".side-foot")){ S.profOpen = false; render(); }
  const g = t.closest("[data-go]");
  if(g && !t.closest("[data-act]")){ go(g.dataset.go); return; }
  const b = t.closest("[data-act]");
  if(b){
    const act = b.dataset.act, v = b.dataset.v;
    if(act === "menu"){ document.body.classList.toggle("nav-open"); return; }
    if(act === "side-toggle"){ S.sideHidden = !S.sideHidden; LS.set("evopilot.sideHidden", S.sideHidden); render(); return; }
    if(act === "back"){ goBack(); return; }
    if(act === "cal-prev" || act === "cal-next"){ S.cal.off += act === "cal-next" ? 1 : -1; render(); return; }
    if(act === "cal-today"){ S.cal.off = 0; render(); return; }
    if(act === "cal-mode"){ if(S.cal.mode !== v){ S.cal.mode = v; S.cal.off = 0; render(); } return; }
    if(act === "cal-day"){ const d = parseISO(v), mon = weekRange().mon; const day0 = new Date(d); day0.setDate(d.getDate() - ((d.getDay()+6)%7)); S.cal.mode = "week"; S.cal.off = Math.round((day0 - mon)/(7*DAY)); render(); return; }
    if(act === "new"){ openNew(); return; }
    if(act === "new-in"){ openNew({space:v}); return; }
    if(act === "profile"){ S.profOpen = !S.profOpen; render(); return; }
    if(act === "set-me"){ S.profOpen = false;
      if(S.auth === "ok"){ if(!S.isOwner) return; S.viewAs = v === S.myPid ? null : v; S.me = v; S.hist = []; render(); return; }
      S.me = v; LS.set("evopilot.me", v); render(); return; }
    if(act === "claim"){ claimProfile(v); return; }
    if(act === "unlink"){ if(!S.isOwner) return; const uid = takenBy(b.closest("li").dataset.p); if(uid && uid !== S.uid){ S.members.delete(uid); writeDoc("members/"+uid, null); toast("Compte délié : la personne choisira à nouveau son profil."); render(); } return; }
    if(act === "toggle-bl"){ S.blOpen = !S.blOpen; LS.set("evopilot.blOpen", S.blOpen); render(); return; }
    if(act === "add-backlog" && S.me !== ADMIN) return;
    if(act === "add-backlog"){ go("params"); setTimeout(()=>{ const i = $("#blNew"); i && i.focus(); }, 30); return; }
    if(act === "reset"){ S.f = {q:"", person:"", prio:null, due:"", backlog:""}; render(); return; }
    if(act === "prio-box"){ S.f.prio = S.f.prio === v ? null : v; render(); return; }
    if(act === "mine-kind"){ S.mineKind = v; render(); return; }
    if(act === "rv-return-q"){ openReviewModal(v, "return"); return; }
    if(act === "go-ens"){ go("ensemble"); S.f.person = S.me; render(); return; }
    if(act === "archive-done"){ const done = [...S.actions.values()].filter(a=>a.status==="done" && matches(a)); done.forEach(a=>{ const n = clone(a); n.archived = true; persist(n); }); toast(done.length > 1 ? `${done.length} actions archivées.` : "Action archivée."); return; }
    // Paramètres
    const s = clone(settings());
    if(act === "bl-add"){ const i = $("#blNew"); const id = addBacklog(i.value); if(id){ toast(`Adjacence « ${i.value.trim()} » créée.`); } else i.focus(); return; }
    if(act === "p-add"){ const i = $("#pNew"), name = i.value.trim(); if(!name){ i.focus(); return; } s.people.push({id:uid("p"), name}); saveSettings(s); setTimeout(()=>{ const n = $("#pNew"); n && n.focus(); }, 0); return; }
    if(act === "bl-up" || act === "bl-down"){ const id = b.closest("li").dataset.bl, i = s.spaces.findIndex(x=>x.id===id), j = act==="bl-up" ? i-1 : i+1; if(j<0||j>=s.spaces.length) return; [s.spaces[i], s.spaces[j]] = [s.spaces[j], s.spaces[i]]; saveSettings(s); return; }
    if(act === "bl-del"){ const id = b.closest("li").dataset.bl; if(S.pendingConfirm !== "bl:"+id){ S.pendingConfirm = "bl:"+id; render(); return; } S.pendingConfirm = null; for(const a of [...S.actions.values()]) if(a.space===id){ const n = clone(a); n.space = "general"; persist(n); } s.spaces = s.spaces.filter(x=>x.id!==id); saveSettings(s); return; }
    if(act === "p-see"){ const pid = b.closest("li").dataset.p; const cur = seesOf(pid); saveAdmin(d=>{ d.sees[pid] = cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v]; }); return; }
    if(act === "p-del"){ const id = b.closest("li").dataset.p; if(S.pendingConfirm !== "p:"+id){ S.pendingConfirm = "p:"+id; render(); return; } S.pendingConfirm = null; s.people = s.people.filter(x=>x.id!==id); saveSettings(s); return; }
  }
  const tm = t.closest("[data-team]");
  if(tm){ go("ensemble"); S.f.person = tm.dataset.team; render(); return; }
  const tr = t.closest("tr[data-person]");
  if(tr){ go("ensemble"); S.f.person = tr.dataset.person; render(); return; }
  const op = t.closest("[data-open]"); if(op){ openAction(op.dataset.open); return; }
  if(t.closest(".pc-subs") || t.closest(".chk")) return;
  const card = t.closest(".pc"); if(card){ openAction(card.dataset.id); return; }
  if(document.body.classList.contains("nav-open") && !t.closest("#side")) document.body.classList.remove("nav-open");
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.closest("#drawer")){
    if(el.id === "pgDone"){ pgSync(); S.pg.done = el.checked; renderDrawer(); return; }
    if(el.id === "pgStatus"){ pgSync(); renderDrawer(); return; }
    if(el.dataset.field){ setField(el.dataset.field, el.dataset.field === "title" ? el.value.trim() : el.value); return; }
    const li = el.closest(".todo li"); if(!li) return; const sid = li.dataset.sub;
    if(el.classList.contains("st-check")){ li.classList.toggle("ok", el.checked); editSub(sid, x=>{ x.done = el.checked; x.doneAt = el.checked ? Date.now() : null; }); }
    else if(el.classList.contains("st-text")){ const v = el.value.trim(); if(v) editSub(sid, x=>{ x.text = v; }); }
    else if(el.classList.contains("st-who")) editSub(sid, x=>{ x.assignee = el.value; });
    else if(el.classList.contains("st-due")) editSub(sid, x=>{ x.due = el.value; });
    return;
  }
  if(el.classList.contains("sub-check")){ toggleSub(el.dataset.id, el.dataset.sub, el.checked); return; }
  if(el.id === "fperson"){ S.f.person = el.value; render(); return; }
  if(el.id === "fbl"){ S.f.backlog = el.value; render(); return; }
  if(el.id === "fcalp"){ S.cal.person = el.value; render(); return; }
  if(el.id === "fmysp"){ S.mySp = el.value; LS.set("evopilot.mySp", S.mySp); render(); return; }
  if(el.id === "fprio"){ S.f.prio = el.value === "*" ? null : el.value; render(); return; }
  if(el.id === "fdue"){ S.f.due = el.value; render(); return; }
  if(el.id === "tgroup"){ S.grouped = el.checked; LS.set("evopilot.grouped", S.grouped); render(); return; }
  if(el.id === "thide"){ S.hideDone = el.checked; LS.set("evopilot.hideDone", S.hideDone); render(); return; }
  const s = clone(settings());
  if(el.classList.contains("bl-name")){ const id = el.closest("li").dataset.bl, sp = s.spaces.find(x=>x.id===id), v = el.value.trim(); if(sp && v){ sp.name = v; saveSettings(s); } else render(); return; }
  if(el.classList.contains("sp-icon")){ const sp = s.spaces.find(x=>x.id===el.closest("li").dataset.bl); if(sp){ sp.icon = el.value; saveSettings(s); } return; }
  if(el.classList.contains("p-cap")){ const pid = el.closest("li").dataset.p, n = Math.max(1, Math.min(20, parseInt(el.value,10) || 3)); saveAdmin(d=>{ d.cap[pid] = n; }); return; }
  if(el.classList.contains("p-name")){ const id = el.closest("li").dataset.p, p = s.people.find(x=>x.id===id), v = el.value.trim(); if(p && v){ p.name = v; saveSettings(s); } else render(); return; }
});
let qT;
document.addEventListener("input", e=>{ if(e.target.id === "fq"){ clearTimeout(qT); const v = e.target.value; qT = setTimeout(()=>{ S.f.q = v; render(); }, 180); } });
document.addEventListener("keydown", e=>{
  const t = e.target;
  if(S.modal){ if(e.key === "Escape") closeModal(); return; }
  if(e.key === "Escape" && S.openId){ closeDrawer(); return; }
  if(e.key === "Escape" && document.body.classList.contains("nav-open")){ document.body.classList.remove("nav-open"); return; }
  if(t.closest && t.closest("#drawer")){
    if(e.key === "Enter" && t.id === "stNew"){ e.preventDefault(); addSub(); }
    if(e.key === "Enter" && t.classList.contains("dw-title")){ e.preventDefault(); t.blur(); }
    if(e.key === "Enter" && (e.metaKey||e.ctrlKey) && t.id === "cNew"){ e.preventDefault(); addComment(); }
    return;
  }
  if(e.key === "Enter" && t.classList && t.classList.contains("qa")){
    const title = t.value.trim(); if(!title) return;
    const status = t.dataset.status;
    const na = newAction({title, status, doneAt: status==="done" ? Date.now() : null});
    persist(na);
    if(status === "waiting"){ openReviewModal(na.id, "request"); return; }
    const q = document.querySelector(`.qa[data-status="${status}"]`); if(q) q.focus();
    return;
  }
  if(e.key === "Escape" && t.classList && t.classList.contains("qa")){ t.value = ""; t.blur(); return; }
  if(e.key === "Enter" && t.id === "blNew"){ e.preventDefault(); const id = addBacklog(t.value); if(id) toast(`Adjacence « ${t.value.trim()} » créée.`); return; }
  if(e.key === "Enter" && t.id === "pNew"){ e.preventDefault(); document.querySelector('[data-act="p-add"]').click(); return; }
  if((e.key === "Enter" || e.key === " ") && t.classList && (t.classList.contains("pc") || t.matches("tr[data-person]"))){ e.preventDefault(); t.click(); }
});

/* Glisser-déposer : colonnes, cellules, et backlogs du menu */
let dragId = null;
document.addEventListener("dragstart", e=>{
  const c = e.target.closest && e.target.closest(".pc"); if(!c || S.readOnly) return;
  dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
});
document.addEventListener("dragend", ()=>{ dragId = null; document.querySelectorAll(".dragging,.over,.drop-over").forEach(x=>x.classList.remove("dragging","over","drop-over")); });
document.addEventListener("dragover", e=>{
  if(!dragId) return;
  const z = e.target.closest && (e.target.closest(".dz") || e.target.closest("[data-drop-bl]")); if(!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".over,.drop-over").forEach(x=>{ if(x!==z) x.classList.remove("over","drop-over"); });
  z.classList.add(z.dataset.dropBl ? "drop-over" : "over");
});
document.addEventListener("drop", e=>{
  if(!dragId) return;
  const z = e.target.closest && (e.target.closest(".dz") || e.target.closest("[data-drop-bl]")); if(!z) return;
  e.preventDefault(); const id = dragId; dragId = null;
  if(z.dataset.dropBl){ toast("L’adjacence d’une action ne peut plus être modifiée après sa création."); }
  else { const cur = S.actions.get(id); if(cur && z.dataset.space && backlogOf(cur.space).id !== z.dataset.space){ toast("L’adjacence d’une action ne peut plus être modifiée."); return; } moveTo(id, z.dataset.status, null); }
});

/* ======================= Toast ======================= */
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 3200); }

/* ======================= Démarrage ======================= */
function loadLocal(){
  const arr = LS.get("evopilot.actions") || []; S.actions = new Map(arr.map(a=>[a.id,a]));
  const st = LS.get("evopilot.settings"); if(st && Array.isArray(st.spaces) && Array.isArray(st.people)){ S.settings = st; const g = st.spaces.find(x=>x.id==="general"); if(g && g.name === "Général"){ g.name = "Projet à l’étude & autre"; LS.set("evopilot.settings", st); } }
}
async function init(){
  render();
  let db = null;
  try{ db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(!db){ S.mode = "local"; loadLocal(); render(); return; }
  S.db = db; S.mode = "db";
  let user = null;
  try{ user = await window.claude.use("user"); }catch(e){ user = null; }
  S.user = user;
  if(user){
    try{ S.isOwner = !!user.isOwner(); }catch(e){}
    try{ S.uid = await user.id(); }catch(e){ S.uid = null; }
    try{ S.acct = await user.me(); }catch(e){ S.acct = null; }
  }
  if(S.uid){
    S.auth = "pending";
    const at = setTimeout(()=>{ if(!S.membersLoaded){ S.membersLoaded = true; resolveMe(); render(); } }, 10000);
    db.collection("members").onSnapshot(snap=>{
      S.members = new Map(snap.docs.map(d=>[d.id, (d.data()||{}).person]).filter(x=>x[1]));
      S.membersLoaded = true; clearTimeout(at); resolveMe(); render();
    }, ()=>{ S.membersLoaded = true; clearTimeout(at); resolveMe(); render(); });
  }
  db.doc("admin/main").onSnapshot(d=>{ S.admin = d.exists ? (d.data()||{}) : {}; render(); }, ()=>{});
  let ok = false;
  const timer = setTimeout(()=>{ if(!ok){ S.stale = true; render(); } }, 10000);
  db.collection("actions").onSnapshot(snap=>{
    S.actions = new Map(snap.docs.map(d=>[d.id, Object.assign({}, d.data(), {id:d.id})]));
    if(!snap.metadata.fromCache){ ok = true; S.stale = false; clearTimeout(timer); }
    render();
    if(S.openId && !current()){ S.openId = null; $("#drawer").innerHTML = ""; document.body.classList.remove("dw-open"); toast("Cette action a été supprimée par un membre de l’équipe."); }
  }, err=>{ clearTimeout(timer); S.dbError = err; S.stale = false; render(); });
  db.doc("settings/main").onSnapshot(s=>{
    if(s.exists){ const d = s.data(); if(d && Array.isArray(d.spaces) && Array.isArray(d.people)){ S.settings = clone(d); const g = S.settings.spaces.find(x=>x.id==="general"); if(g && g.name === "Général" && !S.mig && !S.readOnly && S.isOwner){ S.mig = true; g.name = "Projet à l’étude & autre"; writeDoc("settings/main", clone(S.settings)); } } }
    render();
  }, ()=>{});
  render();
}
init();
</script></body></html>
